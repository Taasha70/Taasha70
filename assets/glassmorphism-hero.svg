<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Tanisha — studio portrait</title>
  <desc id="desc">Glassmorphism GitHub banner for Tanisha, a BCA student exploring web development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100b24"/><stop offset=".5" stop-color="#29113d"/><stop offset="1" stop-color="#08091b"/></linearGradient>
    <radialGradient id="glow1"><stop stop-color="#c66eae" stop-opacity=".7"/><stop offset="1" stop-color="#c66eae" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop stop-color="#f5c76c" stop-opacity=".55"/><stop offset="1" stop-color="#f5c76c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow3"><stop stop-color="#73d9e9" stop-opacity=".65"/><stop offset="1" stop-color="#73d9e9" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#fff" opacity=".1"/></pattern>
  </defs>
  <rect width="1600" height="560" rx="22" fill="url(#bg)"/>
  <g filter="url(#blur)"><ellipse cx="330" cy="160" rx="330" ry="220" fill="url(#glow1)"/><ellipse cx="800" cy="300" rx="280" ry="190" fill="url(#glow2)"/><ellipse cx="1160" cy="410" rx="340" ry="230" fill="url(#glow3)"/></g>
  <rect x="2" y="2" width="1596" height="556" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="3"/>
  <rect x="105" y="92" width="1390" height="378" rx="44" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".68" stroke-width="2"/>
  <rect x="105" y="92" width="1390" height="378" rx="44" fill="url(#grain)" opacity=".55"/>
  <circle cx="250" cy="122" r="5" fill="none" stroke="#f4d16d" stroke-width="1.5"/>
  <text x="160" y="158" font-family="monospace" font-size="17" letter-spacing="6" fill="#f4d16d">— STUDIO. PORTRAIT.</text>
  <text x="160" y="235" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#fff4d6">Tanisha</text>
  <text x="160" y="282" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic" fill="#f0e8ff">BCA student · web developer in progress</text>
  <rect x="160" y="316" width="82" height="4" fill="#f4d16d"/>
  <text x="160" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">Learning, building, and exploring tech one project at a time.</text>
  <text x="160" y="398" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">Currently exploring React, Node.js, and full-stack development.</text>
  <text x="160" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d8d0e8">Curious mind · practical projects · always learning</text>
  <rect x="1020" y="145" width="405" height="260" rx="30" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".20"/>
  <text x="1060" y="183" font-family="monospace" font-size="14" letter-spacing="4" fill="#f4d16d">— SELECTED PROJECTS</text>
  <text x="1060" y="224" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff">01 · ClientFlow</text>
  <text x="1090" y="250" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e3dced">Client, brand &amp; deadline management</text>
  <text x="1060" y="289" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff">02 · Locus</text>
  <text x="1090" y="315" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e3dced">A project in progress</text>
  <path d="M1060 340 H1385" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="1060" y="369" font-family="monospace" font-size="13" letter-spacing="3" fill="#f4d16d">— FIND ME ONLINE</text>
  <text x="1060" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e9e2f5">github.com/Taasha70</text>
